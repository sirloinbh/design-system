# Checks every pull request and every push to main: lint, format, types, tests, secret and supply-chain scans, doc links.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read # install the @sirloinbh shared packages

# A new push to a pull request branch cancels that branch's older run. A run on main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
